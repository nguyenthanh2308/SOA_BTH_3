<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>E-Commerce Demo — Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1 class="title">E-Commerce Demo</h1>

        <!-- Cấu hình URL dịch vụ (ẩn gọn, vẫn chỉnh được) -->
        <details class="card" style="margin-bottom:16px">
            <summary>Cấu hình dịch vụ (tùy chọn)</summary>
            <div class="grid2">
                <div>
                    <label>AuthService URL</label>
                    <input id="authBase" value="https://localhost:7268" />
                </div>
                <div>
                    <label>ProductService URL</label>
                    <input id="prodBase" value="https://localhost:7181" />
                </div>
            </div>
            <div style="margin-top:8px">
                <label>OrderService URL</label>
                <input id="orderBase" value="https://localhost:7182" />
            </div>
            <button id="btnSaveCfg" class="btn" style="margin-top:10px">Lưu cấu hình</button>
            <span id="cfgMsg" class="msg"></span>
        </details>

        <div class="grid2">
            <!-- Đăng nhập Admin -->
            <div class="card">
                <h2>Đăng nhập Admin</h2>
                <p class="hint">Tài khoản demo: <b>admin</b> – mật khẩu là MD5 (ví dụ <code>21232f297a57a5a743894a0e4a801fc3</code>)</p>
                <label>Username</label>
                <input id="adminUser" value="admin" />
                <label>Password (MD5)</label>
                <input id="adminPass" value="21232f297a57a5a743894a0e4a801fc3" />
                <button id="btnLoginAdmin" class="btn">Đăng nhập Admin</button>
                <div id="adminMsg" class="msg"></div>
            </div>

            <!-- Đăng nhập / Đăng ký Khách -->
            <div class="card">
                <h2>Khách hàng</h2>
                <div class="tabs">
                    <button class="tab active" data-tab="login">Đăng nhập</button>
                    <button class="tab" data-tab="register">Đăng ký</button>
                </div>

                <!-- LOGIN -->
                <div id="pane-login">
                    <label>Email</label>
                    <input id="cusEmailLogin" placeholder="you@example.com" />
                    <label>Mật khẩu</label>
                    <input id="cusPassLogin" type="password" />
                    <button id="btnCusLogin" class="btn">Đăng nhập</button>
                    <div id="cusLoginMsg" class="msg"></div>
                </div>

                <!-- REGISTER -->
                <div id="pane-register" class="hidden">
                    <label>Họ tên</label>
                    <input id="cusFullNameReg" placeholder="Nguyễn Văn A" />
                    <label>Email</label>
                    <input id="cusEmailReg" placeholder="you@example.com" />
                    <label>Mật khẩu</label>
                    <input id="cusPassReg" type="password" />
                    <button id="btnCusRegister" class="btn">Đăng ký</button>
                    <div id="cusRegMsg" class="msg"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
